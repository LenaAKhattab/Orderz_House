name: orderzhouse_app
description: Orderz House — client mobile app (Flutter MVP).
publish_to: 'none'
version: 8.1.4+8107

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  app_links: ^6.4.1
  file_picker: ^8.1.7
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
  # Extra inset so the circular launch mask does not clip the mark.
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/branding/
