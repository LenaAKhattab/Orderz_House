# SPA container nginx — used by frontend/Dockerfile.
# Production host nginx should still terminate TLS and may proxy /api directly to
# the backend. This file proxies /api and /images for compose / self-contained deploys.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API + category images — same-origin /api for the SPA.
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /images/ {
    proxy_pass http://backend:5000/images/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed Vite chunks — long cache; never SPA-fallback HTML for missing files.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Entry HTML must revalidate so browsers pick up new chunk hashes after deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    rewrite ^ /index.html last;
  }
}
