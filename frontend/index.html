<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orderz House</title>
    <script>
      (function () {
        try {
          // Keep in sync with src/i18n/localeRelease.js (RELEASED) and localePreference.js (SUPPORTED) — tested.
          var RELEASED = ["ar", "en", "de", "nl", "ro"];
          var SUPPORTED = ["ar", "en", "de", "nl", "ro"];
          var q = /[?&]i18n_preview=([01])/.exec(window.location.search || "");
          if (q && q[1] === "1") localStorage.setItem("orderzhouse.i18nPreview", "1");
          if (q && q[1] === "0") localStorage.removeItem("orderzhouse.i18nPreview");
          var preview = localStorage.getItem("orderzhouse.i18nPreview") === "1";
          var stored = localStorage.getItem("orderzhouse.locale") || localStorage.getItem("oh_locale");
          var locale = RELEASED.indexOf(stored) >= 0 || (preview && SUPPORTED.indexOf(stored) >= 0) ? stored : "ar";
          var root = document.documentElement;
          root.lang = locale;
          root.dir = locale === "ar" ? "rtl" : "ltr";
          root.setAttribute("data-locale", locale);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Hero wallpaper is a single CSS background on `/` (publicHomeShell.css). Do not global-preload it. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
